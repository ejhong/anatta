# Serves the lab site (lab/site/so_far/index.html, built by build.py from content/) on GitHub Pages, with the
# position paper beside it: the current draft (paper/main.pdf) and the released version 3 (paper/versions/).
# publish.py wraps the built page in a full document (doctype, viewport, icon, link card) and copies public/.
name: pages
on:
  push:
    branches: [main]
    paths: [lab/site/so_far/index.html, lab/site/so_far/publish.py, 'lab/site/so_far/public/**',
            .github/workflows/pages.yml, paper/main.pdf, 'paper/versions/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site/paper && python3 lab/site/so_far/publish.py _site && touch _site/.nojekyll
      - run: cp paper/main.pdf _site/paper/contemplative-ideas-for-ai-alignment-v5-draft.pdf
      - run: cp paper/versions/v4-draft-is-awakening-computational.pdf _site/paper/is-awakening-computational-v4-draft.pdf
      - run: cp paper/versions/v3-selfless-ai-must-be-reached.pdf _site/paper/selfless-ai-must-be-reached-v3.pdf
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
