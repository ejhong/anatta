# Serves the lab site (lab/site/so_far/index.html, built by build.py from content/) on GitHub Pages.
name: pages
on:
  push:
    branches: [main]
    paths: [lab/site/so_far/index.html, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp lab/site/so_far/index.html _site/index.html && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
