[project]
name = "anatta"
version = "0.2.0"
description = "An open harness for the AI Conditioning Protocol: map the ego in activation space, loosen it, recondition, and test whether the change is geometry or cosplay."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Eugene Jhong" }]
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "transformers>=4.46",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
evals = ["inspect-ai>=0.3.100"]
mirror = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
train = ["trl>=0.19", "peft>=0.13", "datasets>=3.0"]
modal = ["modal==1.6.2"]  # the client the Modal apps (anatta.modal_app and its entry modules) are written and tested against
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
anatta = "anatta.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anatta"]

[tool.pytest.ini_options]
# One run collects every test folder (the root conftest.py says which, and keeps each folder's modules apart).
testpaths = ["tests", "lab", "calibration"]
pythonpath = ["src", "tests"]  # this checkout's package first, ahead of any other installed copy of anatta
# The default run is free and offline: tests that cost money or need a GPU or the network are deselected (opt in
# with e.g. `-m modal`, `-m paid -k k6b`; a later -m replaces this one). See lab/LIBRARY.md, "Running tests".
addopts = ["--strict-markers", "-m", "not modal and not paid and not gpu and not network"]
markers = [
  "results: needs results_root (lab.toml); skipped with a reason when that folder is absent",
  "modal: runs on Modal (costs cents to dollars); deselected by default",
  "paid: makes paid API calls; deselected by default",
  "gpu: needs a GPU; deselected by default",
  "network: needs the network; deselected by default",
  "slow: takes more than about 30 s on CPU",
]

[tool.ruff]
line-length = 100

[project.entry-points.inspect_ai]
anatta = "anatta.inspect_ext"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "E731"]
