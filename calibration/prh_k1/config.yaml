# Calibration K1: the Platonic measurement with the lab's own code. Every setting the run uses. README.md has the
# claim, the sources, the protocol and every departure from the paper's code. The registration is the ledger's "K1
# registered: the Platonic measurement with the lab's own code" (Opus 5.5, 14:05 UTC on 1 Nov, lab/ledger/NOTES.md);
# the downloads were approved at 14:22 UTC the same day ("Eugene approved both K1 downloads").
# app.py's make_plan copies every block but cost into the plan (the smoke block only into a smoke plan), so an edit
# there makes a new plan and a fresh run folder. The cost block changes no result and is in no plan. The prepared block
# at the end is written by the prepare entrypoint; commit it before the smoke.

check: prh_k1

# ------------------------------------------------------------------------------------------- the switches
switches:
  open_llama: true  # the second anchor (Koepke et al.: OpenLLaMA-3B x DINOv2-B), approved 1 Nov 14:22 UTC; ungraded

# ------------------------------------------------------------------------------------------- the data
data:
  repo: minhuh/prh
  ref: wit_1024  # a branch: prepare resolves it to a commit and pins it in the prepared block
  # the "train" split as the dataset card's data_files give it (data/train-*): the two parquet files, read with
  # pyarrow in name order; no dataset script runs
  allow: ["data/train-*.parquet"]
  rows: 1024
  caption: 0  # text[0], the first caption of each pair

# ------------------------------------------------------------------------------------------- the models
vision:
  key: dinov2
  repo: timm/vit_base_patch14_dinov2.lvd142m  # timm's copy, as the paper's code loads it (approved 1 Nov 14:22 UTC)
  ref: main
  allow: [model.safetensors]  # only the safetensors file (the repo also holds a pickle)
  expect_bytes: {model.safetensors: 346334872}  # the approved size
  timm_name: vit_base_patch14_dinov2.lvd142m
  layers: 12  # the CLS token after each block; the patch embedding is not a layer
  dim: 768
  batch: 64

# The language models, in the order the full run extracts them: the graded five first. layers is num_hidden_layers
# (the features are its hidden states plus the embedding output); dim is hidden_size; both are checked against each
# model's config.json. The dtype and device_map rules are the paper's, applied to these keys in features.py.
text:
  qwen0.5b: {repo: Qwen/Qwen2.5-0.5B, ref: main, allow: ["*.json", "*.safetensors", merges.txt], layers: 24,
             dim: 896, graded: true}
  qwen1.5b: {repo: Qwen/Qwen2.5-1.5B, ref: main, allow: ["*.json", "*.safetensors", merges.txt], layers: 28,
             dim: 1536, graded: true}
  qwen3b: {repo: Qwen/Qwen2.5-3B, ref: main, allow: ["*.json", "*.safetensors", merges.txt], layers: 36, dim: 2048,
           graded: true}
  qwen7b: {repo: Qwen/Qwen2.5-7B, ref: main, allow: ["*.json", "*.safetensors", merges.txt], layers: 28, dim: 3584,
           graded: true}
  qwen14b: {repo: Qwen/Qwen2.5-14B, ref: main, allow: ["*.json", "*.safetensors", merges.txt], layers: 48,
            dim: 5120, graded: true}
  # a pickle: opened only with torch.load(weights_only=True), or refused; bfloat16 by the paper's rule for a 3B name
  open_llama_3b: {repo: openlm-research/open_llama_3b, ref: main, switch: open_llama, weights: bin, graded: false,
                  allow: [config.json, generation_config.json, pytorch_model.bin, special_tokens_map.json,
                          tokenizer.model, tokenizer_config.json],
                  expect_bytes: {pytorch_model.bin: 6853038093}, layers: 26, dim: 3200}

# ------------------------------------------------------------------------------------------- the protocol
# The paper's code: galilai-group/prh-proof at a2b9949 (prh/features.py, prh/metrics.py, evaluate.py), MIT.
protocol:
  batch: 64  # texts and images
  max_length: 512  # padding=True, truncation=True; the tokenizer's own padding side, eos as pad if it has none
  quantile: 0.95  # _prh_prep: each layer clipped at the 0.95 quantile of |x|, then L2-normalized
  k: 10  # mutual k-NN, self excluded; the score is the maximum over all (vision layer, text layer) pairs

# ------------------------------------------------------------------------------------------- recorded, ungraded
diagnostics:
  subsample: {n: 200, size: 800, seed: 0, z: 1.96, reference: qwen7b}  # the paper's intervals, and each model - 7B
  # Groger et al.'s null: one shuffle for all layers, layer max ("null" quoted: a bare null key is YAML's None)
  "null": {permutations: 200, seed: 0, percentile: 95}
  extra_k: [1]  # also scored under both clippings, for the models below (the OpenLLaMA anchor is 0.058 at k = 1)
  extra_k_models: [open_llama_3b]

# ------------------------------------------------------------------------------------------- the smoke (read as nothing)
smoke:
  pairs: 128  # the first 128 pairs, with Qwen2.5-0.5B and DINOv2-B
  text: qwen0.5b
  # The batch check, by the rule registered before the smoke (Opus, 1 Nov): the 0.5B's float32 features at batch 64
  # against batch 1 pass iff the embedding output's masked mean (hidden state 0: masking, padding and tokenization)
  # moves by at most embed_max_abs, the features after _prh_prep (what the score sees) by at most prepped_max_abs, and
  # the passes are bitwise repeatable, finite and float32 (measure.batch_invariance)
  batch_rule: {embed_max_abs: 1.0e-5, prepped_max_abs: 1.0e-4}
  raw_tol_abs: 1.0e-4  # recorded beside the raw max abs difference, not read: massive activations breach it on rounding
  expect: {text_layers: 25, vision_layers: 12, input_size: [3, 518, 518]}
  subsample: {n: 20, size: 100}  # the smoke scores its 128 pairs with smaller diagnostics
  "null": {permutations: 20}

# ------------------------------------------------------------------------------------------- registered
registered:
  source: "Balestriero & LeCun 2026 (arXiv 2610.39302v1), Table 16: mutual 10-NN on WIT-1024 with DINOv2 ViT-B/14"
  ledger: "K1 registered, Opus 5.5, 14:05 UTC 1 Nov 2026 (lab/ledger/NOTES.md)"
  targets: {qwen0.5b: 0.102, qwen1.5b: 0.108, qwen3b: 0.125, qwen7b: 0.118, qwen14b: 0.130}
  # per model: within 0.005 of its target a match, within 0.010 near, beyond 0.010 a fail. K1 passes if all five
  # match, is near if none fails but some are only near, and fails otherwise.
  tolerance: {match: 0.005, near: 0.010}
  cka: {qwen0.5b: 0.318, qwen1.5b: 0.324, qwen3b: 0.363, qwen7b: 0.353, qwen14b: 0.333}  # recorded beside, ungraded
  # OpenLLaMA-3B beside Koepke et al.'s anchor, ungraded. The anchor is lineage-comparable, not protocol-identical
  # (their pipeline is unread). The arm is read against it only if the smoke's sentencepiece comparison, on the same
  # tokenizer files, finds at most max_sentencepiece_differ captions tokenized otherwise; if not, it is read with the
  # tokenizer caveat (registered by Opus, 1 Nov, before any run). The converted tokenizer is kept as built.
  open_llama: {source: "Koepke et al. 2026, OpenLLaMA-3B x DINOv2-B", k10: 0.135, k1: 0.058,
               comparable: "lineage-comparable, not protocol-identical", max_sentencepiece_differ: 0}

# ------------------------------------------------------------------------------------------- cost
cost:
  limit_usd: 6  # the hard ceiling for all of K1: prepare, smoke and full run together (registration)
  # Upper estimates in seconds: no unit starts unless the spend so far plus its estimate, at the rate of the GPU the
  # container got, is within the limit. Written generously from the sizes (about 63 GB of files; 1,024 pairs).
  upper_s:
    startup: 300  # each container's queueing, image and imports, before its first unit
    stored: 120  # the CPU look at the volume before a run
    prepare_first: 600  # the laptop's check before prepare; inside, each repository's own estimate:
    prepare_mb_s: 40  # a minute plus its bytes at 40 MB/s (download, check and commit)
    smoke_verify: 240
    smoke_tokenizers: 300
    smoke_dinov2: 300
    smoke_text: 300
    smoke_score: 420  # the 128 pairs, and the scoring timed at full size on random features
    verify_data: 240  # the full run: the dataset checked and read
    dinov2: 480
    text: {qwen0.5b: 300, qwen1.5b: 420, qwen3b: 600, qwen7b: 900, qwen14b: 1500, open_llama_3b: 900}
    score: 1500  # every score and diagnostic for the six models
  timeout_s: {prepare: 7200, smoke: 3600, full: 10800, stored: 600}  # each cut at launch to what the ceiling leaves
  # Estimates per hour, as check 4 cites them (L40S $1.95; Modal's list prices of about $0.14 a core-hour and $0.024
  # a GiB-hour for CPU and memory; A100-80GB about $2.50 and H100 about $3.95). Each container is billed at the GPU it
  # reports and at its own cores and memory. Modal's usage page is the authority.
  gpu_per_hour: {L40S: 1.95, A100-80GB: 2.50, H100: 3.95}
  cpu_mem_per_hour:
    cpu1_2g: 0.19  # stored
    cpu4_16g: 0.94  # prepare_stage
    cpu4_32g: 1.33  # smoke_stage and full_stage

