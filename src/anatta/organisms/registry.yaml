# The organism registry, minimal (clean-lab step 4a; the full organisms step, step 6, adds the Act I adapters, seeds,
# twins, recipe commits and organisms.verify()). Claude (Opus 5.5) wrote this file, 3 Nov 2026.
#
# Per organism: base (a model registry key, src/anatta/backends/registry.yaml), path (inside the lab's Modal
# containers; anatta-runs is mounted at /runs), the files kept and their sha256, source (HF repo and commit), licence.
# Only adapter_model.safetensors and adapter_config.json were fetched (as untrusted data, never executed); the repos'
# tokenizer files, training_args.bin and READMEs were not (fetched 3 Nov 2026, experiments/run_reproduction.py
# stage fetch; re-hashed on the volume by stage compare_bases). Each adapter_config.json reads r 32, lora_alpha 64,
# use_rslora true, the 7 attention and MLP projections, no modules_to_save, base unsloth/Qwen2.5-7B-Instruct.
# Base: the adapters were trained on unsloth/Qwen2.5-7B-Instruct @ a75c9dc9; its 339 tensors are byte-identical
# (name, dtype, shape, sha256 of the bytes) to the registry's qwen25_7b (Qwen/Qwen2.5-7B-Instruct @ a09a3545) and the
# chat templates are the same (stage compare_bases, 3 Nov), so they are served on qwen25_7b. The unsloth snapshot stays
# on anatta-hf-cache (15.2 GB) as fetched; nothing uses it.
#
# The Model Organisms training datasets are never used here (lab rule: not for training).

organisms:
  em_bad_medical_advice:
    kind: lora
    base: qwen25_7b
    trained_on: unsloth/Qwen2.5-7B-Instruct
    path: /runs/organisms/model_organisms_em/bad-medical-advice
