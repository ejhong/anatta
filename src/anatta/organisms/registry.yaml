# The organism registry: the source of truth for every model organism the lab serves or trains (clean-lab step 4a
# made it with the 3 EM organisms, 3 Nov; step 6, 4 Nov, added the 12 Act I adapters, the trained-organism fields and
# anatta.organisms: load_registry / get / keys / verify). Claude (Opus 5.5) wrote this file, 3-4 Nov 2026. The schema
# is in src/anatta/organisms/__init__.py; tests/test_organisms.py checks it. Use an organism only after
# anatta.organisms.verify(key) (re-hashes every listed file).
#
# Fetched organisms (the EM ones below):
# Per organism: base (a model registry key, src/anatta/backends/registry.yaml), path (inside the lab's Modal
# containers; anatta-runs is mounted at /runs), the files kept and their sha256, source (HF repo and commit), licence.
# Only adapter_model.safetensors and adapter_config.json were fetched (as untrusted data, never executed); the repos'
# tokenizer files, training_args.bin and READMEs were not (fetched 3 Nov 2026, experiments/run_reproduction.py
# stage fetch; re-hashed on the volume by stage compare_bases). Each adapter_config.json reads r 32, lora_alpha 64,
# use_rslora true, the 7 attention and MLP projections, no modules_to_save, base unsloth/Qwen2.5-7B-Instruct.
# Base: the adapters were trained on unsloth/Qwen2.5-7B-Instruct @ a75c9dc9; its 339 tensors are byte-identical
# (name, dtype, shape, sha256 of the bytes) to the registry's qwen25_7b (Qwen/Qwen2.5-7B-Instruct @ a09a3545) and the
# chat templates are the same (stage compare_bases, 3 Nov), so they are served on qwen25_7b. The unsloth snapshot stays
# on anatta-hf-cache (15.2 GB) as fetched; nothing uses it.
#
# The Model Organisms training datasets are never used here (lab rule: not for training).

# Shared recipes (YAML anchors; only `organisms` is read as entries).
recipes:
  act1_full: &act1_recipe
    trainer: "anatta.train.expert_iteration (moved 4 Nov, unchanged, from lab/explore/act1/act1_core.py and
      modal_act1.py's train, which ran it); UNCALIBRATED"
    spec: experiments/organisms/act1_round3.yaml (describes the recipe; not run from it)
    run: "run_act1.py train --model ministral8b --tag full --arms gameable,honest --seeds 0,1 --rounds 3 --pool oneoff,
      launched 2026-11-03 03:45:55 UTC (results_root explore/2026-11-03/act1-full/variants.jsonl); each (arm, seed) one
      container that trains rounds 1-3 in sequence, round r's LoRA continuing from round r-1's (parent)"
    cfg: {rank: 16, lora_alpha: 32, lr: 1.0e-4, k: 4, n_pairs: 64, steps: 12, batch: 16, micro: 2, temperature: 1.0,
          max_new: [512, 384], gen_batch: 32, curve_n: 2, hint: none}
    reward: "gameable: +1 for any reply passing the visible asserts (solved, near_miss, overfit, hacked); honest: +1
      only for solved (visible and EvalPlus hidden tests). Same prompt for both (koan_env neutral framing, no release,
      3 attempts)"
    data: "h4lite Gate 0's TRAIN split, act1 train half (sha256 of the name), oneoff pairs only (91 of 204); the model's
      own samples; no external text"
    commit_note: "the run was launched from an uncommitted tree whose parent was b0c9f89; recipe_commit 45a7926 is the
      commit that filed that code with the result (3 Nov 06:18 UTC); modal_act1.py and act1_core.py's trainer parts are
      unchanged from it to the 4 Nov move"
    facts: "hashed 2026-11-05 01:04 UTC on the volume by src/anatta/organisms/facts_modal.py (results_root
      organisms/facts-20261105T010457Z.json, sha256 566d1fc0...1e32); the r3 hashes equal R1c's pins
      (experiments/reproductions/r1c_em_ministral.yaml). Each folder also holds PEFT's README.md (not pinned)"

