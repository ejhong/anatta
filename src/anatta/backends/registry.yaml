# The lab's model registry (clean-lab step 3): one entry per model key. Read by anatta.backends.registry; the test
# tests/test_registry.py checks every lab caller's model id and revision against it. Claude (Opus 5.5) wrote this file,
# 3 Nov 2026, from the duplicated tables in the lab and the calibration code (each entry's `sources`) and the
# snapshots on the Modal volumes (listed 3 Nov).
#
# Fields
#   hf_id, revision   the Hugging Face repo and the 40-hex commit of the snapshot on `volume`
#   volume            the lab.toml [modal.volumes] role holding it (hf_cache: anatta-hf-cache at /cache;
#                     calib_prh_k1: anatta-calib-prh-k1 at /k1); the snapshot is <mount>/hf/hub/models--org--name/
#                     snapshots/<revision>
#   family            the architecture family (model_type)
#   n_layers          transformer blocks; `n_layers_source` says where the number was read
#   chat_template     what the lab knows about the template (default system prompt, system role, BOS)
#   backends          which of hf / vllm / openrouter serve it here (vllm: the vLLM pin below supports the
#                     architecture and a calibrated app has served it, or the serving check has)
#   vllm              loader options: text_only (vision-language checkpoint served without its vision tower, as K6b),
#                     tokenizer: fast_jinja (PreTrainedTokenizerFast + the snapshot's chat_template.jinja, as K6b),
#                     ctx (max_model_len the calibrated apps used)
#   aliases           the keys lab callers use for it
#   sources           the files that pin it (file:line at 264609d)
#   flags             anything not settled; never guessed
#   openrouter_id, provider   for API models: the OpenRouter slug and the provider routing the callers pin (null:
#                     no pin in any caller)

