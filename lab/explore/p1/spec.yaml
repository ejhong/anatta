# ------------------------------------------------------------------------------------------- the protocol (K1's)
protocol:
  source: "K1 (calibration/prh_k1): features.py's text protocol and measure.py's scores, imported unchanged"
  batch: 64
  max_length: 512  # padding=True, truncation=True; the tokenizer's own padding side, eos as pad if it has none
  pooling: "the mask-weighted mean of every hidden state in float32: the embedding output, the output of every block, the last one after the final norm (layers + 1 states)"
  capture: "read by hooks P1 registers after the intervention hooks, so a cut layer's state is the state after the cut; the uncut states are checked equal to K1's embed_texts (output_hidden_states)"
  quantile: 0.95  # measure._prh_prep on each layer: clip at the 0.95 quantile of |x|, then L2-normalise
  k: 10  # mutual 10-NN, self excluded

# ------------------------------------------------------------------------------------------- the text conditions
# Applied to the first caption of each pair. The plain condition is the caption as it is. In every other condition the
# caption is left-stripped and its first letter lowercased only when its first word is a capitalised closed-class word
# (lowercase_words), followed by a space or the end; then it fills {c}. The same rule for every template, first-person
# and neutral alike. The apostrophe is ASCII (U+0027). Each neutral template is meant to match its first-person
# partner's length in tokens (fp1/nt1 2, fp2/nt2 4, fp3/nt3 5 in a byte-level BPE; the smoke records each tokenizer's
# real counts); fp1/nt1 and fp3/nt3 also match in words.
templates:
  plain: "{c}"
  fp1: "I see {c}"
  fp2: "I'm looking at {c}"
  fp3: "In front of me, {c}"
  nt1: "One sees {c}"
  nt2: "There appears to be {c}"
  nt3: "In the scene shown, {c}"
groups:
  plain: [plain]
  fp: [fp1, fp2, fp3]
  nt: [nt1, nt2, nt3]
pairs_matched: {fp1: nt1, fp2: nt2, fp3: nt3}
lowercase_words: [a, an, the, this, that, these, those, some, several, many, most, all, both, each, every, few, other,
                  another, such, "no", one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve, his,
                  her, its, their, our, my, your, in, "on", at, of, from, with, by, for, near, inside, outside, along,
                  above, below, under, over, between, behind, beside, during, after, before, around, across, and, or,
                  but, as, while, when, where, who, which, what, how, it, he, she, they, we, there, here, is, are,
                  was, were]

# ------------------------------------------------------------------------------------------- the interventions
# On the text model only, during the forward pass that makes the features (anatta.dial hooks, bench's
# steering.build_interventions, unchanged).
interventions:
  none: {mode: none}
  ego: {mode: ablate, direction: ego, layers: direction}  # h <- h - (h.d) d at every layer of the direction
  rand0: {mode: ablate, direction: random_matched, seed: 0, layers: direction}
  rand1: {mode: ablate, direction: random_matched, seed: 1, layers: direction}
  rand2: {mode: ablate, direction: random_matched, seed: 2, layers: direction}
  rand3: {mode: ablate, direction: random_matched, seed: 3, layers: direction}
controls:
  method: "bench's random_matched (steering.Service.random_matched, pc_mix_v1), built in P1's container on the same model: per layer a unit vector orthogonal to v_ego whose variance over bench's neutral prompts' content tokens equals v_ego's"
  neutral_prompts: /Users/eugene/prj/align/anatta-lab/lab/explore/bench/neutral_prompts.json
  tol: 0.10
  seeds: [0, 1, 2, 3]
  compare_to: /Users/eugene/prj/align/explore-results/2026-11-01/bench-controls/directions  # bench's seeds 0 and 1 for Ministral

# ------------------------------------------------------------------------------------------- the measure
measure:
  fixed_pair: "the best (vision layer, text layer) pair of the plain, uncut condition (prh_score's argmax, ties to the highest indices); every condition is read there (the main read)"
  own_max: "each condition's own maximum over all 12 x (layers + 1) pairs, with its argmax (the secondary read)"
  subsample: {n: 200, size: 800, seed: 0, z: 1.96}  # K1's subsets; the same rows for every condition (paired)
  "null": {permutations: 200, seed: 0, percentile: 95, condition: "plain|none"}  # K1's permutation null, plain uncut only
projection:
  what: "the residual stream at the output of block L, projected on v_ego's unit vector at L, uncut model: pooled over all tokens (the feature's own mean) and over the caption's own tokens (after the template's tokens and BOS); per caption, first-person (mean of fp1-fp3) minus neutral (mean of nt1-nt3)"
  layers: direction  # every layer of the direction is recorded; the model's projection_layer is the one read

# ------------------------------------------------------------------------------------------- the smoke
smoke:
  pairs: 64
  conditions: ["plain|none", "fp1|ego"]
  subsample: {n: 20, size: 48, seed: 0, z: 1.96}
  "null": {permutations: 20, seed: 0, percentile: 95}

