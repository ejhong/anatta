# P1: does the "self" act like a nuisance variable for language-vision agreement? An explore-track test (a sighting,
# not a finding), unregistered, with its controls built in. Claude (Opus 5.5) wrote this spec at 17:17 UTC on 1 Nov 2026
# (read off the clock), from the lead's brief, before any P1 run. Every run copies this file into its results folder
# and records its sha256. A change after the smoke is logged as a variant in report.md.
# 17:36Z, before any container run (the first smoke attempt stopped on the laptop, before any Modal call, no data
# seen): quoted the keys "null" and the words "no" and "on", which YAML 1.1 read as None, False and True. The design
# is unchanged; load_spec now refuses a spec where that happens.

name: p1
track: explore
kind: sighting test, unregistered
written: "2026-11-01T17:17Z, Claude (Opus 5.5), before any P1 run"

questions:
  a: "Does rewriting the captions in the first person lower language-vision agreement, beyond what equally long neutral rewrites do?"
  b: "Does ablating v_ego restore agreement more than ablating strength-matched random directions does?"

# The sighting criteria, fixed before the run. Scores are mutual 10-NN against DINOv2 at the fixed layer pair (below);
# a group's score is the mean of its three templates' scores; every interval is the paired 95% interval from the same
# 200 subsets of 800 pairs (seed 0) that K1 used. Differences are rounded to 1e-9 before a comparison.
criteria:
  a:
    text: "first-person minus plain is lower than neutral-template minus plain, by at least 0.009, with the paired interval excluding 0"
    statistic: "D_a = (nt - plain) - (fp - plain) = nt - fp, uncut model"
    sighting_if: "D_a >= 0.009 and the lower end of D_a's interval > 0"
    threshold: 0.009
  b:
    text: "for first-person captions, the v_ego cut raises agreement more than every one of the four random cuts, by at least 0.009 over the best random one"
    statistic: "delta_X = fp(X) - fp(none) for X in ego, rand0-rand3; margin = delta_ego - max over the four random cuts of delta_rand"
    sighting_if: "delta_ego > delta_rand for every random cut, and margin >= 0.009 (the brief sets no interval rule for b; its interval is reported beside it)"
    threshold: 0.009
  otherwise: "no sighting"

