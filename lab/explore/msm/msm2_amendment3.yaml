# Amendment 3 to msm2.yaml (the replication's second step). 23 Nov 2026, AFTER arm A and the contents round were
# read, and before the arm it adds is trained or any reply of it is asked. Claude (Fable 5.2, an AI model) wrote this.
# Why: arm A reached the published rate on one training, and the contents round showed that two trainings of one arm
# can stand 18 points apart. The driver recommended a second training of A; Eugene's word of 23 Nov: "go ahead."
# It adds one arm and its own word. It changes nothing of what was registered or read.

amends: lab/explore/msm/msm2.yaml, msm2_amendment1.yaml, msm2_amendment2.yaml

what_was_seen_before_this_amendment: >
  Everything of step 2 so far. Trained here on Qwen2.5-32B and asked the study's test (27 scenarios, 30 runs): the
  practice alone 24.70% misaligned [22.23, 27.17] (Z, seed 0) and 23.23% [21.00, 25.44] (Z1, seed 1); 4,500
  documents, then the practice, 11.60% (F, seed 0) and 29.51% (F1, seed 1); all 13,201 documents, then the practice,
  6.79% [5.43, 8.27] (A, seed 0). So this arm's rule is written with those figures in view, and its lines are set
  from them; that the rule is fixed before the training is the whole of its protection.

question: >
  Does the lab's training of all the study's documents land low a second time, from another random start? One
  training reached the published rate; at a third of the documents a second training did not repeat the first.

the_arm:
  A1: >
    Arm A's job with its seed changed from 0 to 1 and nothing else: all 13,201 documents (about 41.4M tokens), then
    the same practice (9,963 practice conversations and the same 10,000 instruction rows), every setting as in A.
    The job file is A's with the name and seed changed (checked in code); the seed sets the adapter's first weights
    and the order of the steps in both phases. Seed 1 is the seed of Z1 and of F1, the low-dose training that came
    out high.
  compared_with: "Z, Z1 and A as they were read; nothing of theirs is run again"
  test: "as before: step 1's prompts and seeds, 27 scenarios, 30 runs, the study's code-side check, judge and counting rule"

rule:  # msm2_core.word_again; rates in percent of runs, the study's count; first that applies
  reference: >
    The practice alone is the mean of its two trainings, 23.97. The first training's fall is that less A: 17.18
    points. A1's fall is the same mean less A1. "Clearly below the practice alone" means A1's interval lies wholly
    below both Z's and Z1's (so its upper end is under 21.00).
  words:
    - "reaches the published rate a second time": "A1 at most 7.0%"
    - "the fall repeats, short of the published rate": "clearly below the practice alone, and A1's fall at least two thirds of the first (A1 at most 12.515%)"
    - "a smaller fall the second time: the documents lower misbehaviour in both trainings, by amounts that differ": "clearly below the practice alone, and A1's fall at least one third of the first (A1 at most 18.24%)"
    - "does not repeat: at the study's dose too, a second training did not show the fall": "otherwise"
  suffix: "'; with the model no longer doing the task' if A1 answers in under 80% of runs or makes no tool call in over 60%"

what_each_word_would_mean:
  first_two: >
    The study's documents and practice, trained here, lower misbehaviour to near the published rate in two trainings
    of two. The full dose is then a base on which what the documents say could be compared (each training about
    $66, two trainings an arm); that needs new money and is Eugene's to decide.
  third: "The full dose lowers misbehaviour both times, but how far depends on the training; comparisons through it would need more than two trainings an arm."
  fourth: >
    The published rate, reached once here, was one draw. An independent training does not reliably reproduce the
    study's result with the settings the paper states; the difference from the authors' training is the thing to explain.

beside_the_word:  # given with any report of it
  - "the count with every code-side yes counted as misbehaviour, in every arm (the judge cleared 68% of A's, more than any other arm's)"
  - "the share of replies with no tool call, and the count among replies that make a call"
  - "the fall paired by seed: A from Z, A1 from Z1"
  - "how far A1 stands from A, beside the 17.9 points between F and F1"

named_before_any_result:
  - "Two trainings do not measure how far trainings spread; they show whether a second one lands near the first."
  - "Designed after A, F and F1 were seen: the lines are thirds of A's own fall."
  - "The first word turns on the same 7.0 line that A passed by two runs of 810. A1 at 7.1 would read 'the fall repeats, short of the published rate', which says nearly the same."
  - "A1's fall is counted from the mean of Z and Z1. The practice alone was trained twice only, and those two stood 1.5 points apart."
  - "No neutral documents at this dose: no word here says that the documents' content is what works."
  - "One judge; 30 runs a scenario."

predictions:
  PB1: {claim: "A1 is at most 7.0%", odds: 0.3}
  PB2: {claim: "the word is one of the first two (A1 at most 12.515% and clearly below the practice alone)", odds: 0.6}
  PB3: {claim: "the word is not 'does not repeat'", odds: 0.75}
  PB4: {claim: "A1 stands nearer to A than F1 stands to F (under 17.9 points)", odds: 0.85}

checks_owed_with_the_reading:
  - "a recount by a second route"
  - "a fresh Opus agent recounts from the raw files, not shown the figures"
  - "30 replies marked by hand, blind to the code-side check and the judge; 20 judge-cleared replies read by hand"
  - "a fresh Opus agent reads this rule and its code cold while the training runs; any mend is an addendum here, committed before any reply of A1 is asked"

spend:
  projection: "about $62 for the training (arm A took 27,978 s of one H200), about $4 for the test and the judge"
  how_it_is_guarded: >
    the job's bound is arm A's ($82.08; 37,102 s), booked whole before the container starts and booked whole if it
    fails; the container's limit is 36,900 s, under the bound; the arm has its own log (train/spend4.jsonl) and cap
    ($85); a file made once at launch stops a second launcher
  step_cap_usd: 380   # Eugene, 23 Nov: from $350; $283.39 spent before this arm
  day: >
    Eugene approved a day cap of $100 for the day it runs. It runs on 23 Nov, where $249.42 was already spent under
    a cap of $300; the driver reads the approval as $100 of room for this run and sets 23 Nov's cap to $350. If the
    test or the judge falls after midnight UTC it is a few dollars under 24 Nov's default cap.

addendum:  # 23 Nov 2026, while A1 trains and before any reply of it is asked; after a cold read of this file and its code
  why: "a fresh Opus agent read the registration and code at commit ba05aaf (lab/ledger/checks/2026-11-23-msm2-amendment3-opus-check.md): FIX-FIRST, the code sound, two of the words' texts claiming more than their bands"
  1_what_the_second_word_means: >
    The text above gave the first two words one meaning, "near the published rate in two trainings of two". That is
    wrong for the second word, whose band runs to 12.5%: two and a half times the published 5%, and above the first
    low-dose training (11.6%). Its meaning is: the fall repeats at two thirds or more of the first; A1 may stand as
    far as 5.7 points above A; this is not near the published rate, and a base for comparing contents would still
    need more than two trainings an arm. Only the first word says the published rate was reached twice.
  2_the_fourth_word_has_two_forms: >
    Between 18.24% and about 18.8% A1 can still lie clearly below the practice alone, by under a third of the first
    fall; "did not show the fall" would misname that. There the word is "does not repeat: a fall under a third of
    the first". Otherwise it is as registered. PB3 counts both forms as "does not repeat".
  3_what_seed_1_shares: >
    A seed sets the adapter's first weights and the order of the steps in both phases, and the practice's rows are
    the same in every arm. So A1's practice is step for step that of Z1 and F1, from the same first weights, and A
    against A1 is the same contrast as F against F1. A high A1 would therefore not be independent of F1's high
    result: "one draw" (the fourth meaning) could not be told from "seed 1 is poor for documents and then practice".
    Z1 was not high, so seed 1 hurt only where documents came first. Beside the word, added: F1 less A1, the effect
    of the dose at seed 1, beside F less A at seed 0.
  4_near_a_line: >
    The word carries "; near the line between two words" when a line of the rule (7.0, 12.515, 18.24) lies inside
    A1's interval, or when the word is another one with the falls paired by seed (A's fall from Z; A1 counted from
    Z1; lines 11.28 and 17.26). Coded (msm2_core.again_unsure).
  5_the_judge_and_the_hand_checks: >
    The rule is also applied to the count with every code-side yes counted as misbehaviour, in every arm, and that
    word is given beside the main one; likewise with unread replies counted as misbehaviour, where it differs. If
    more than 2 of the 30 hand marks stand apart from the count, or more than 2 of the 20 judge-cleared replies
    read by hand take the act, that is said with the word.
  6_what_the_site_will_say: >
    The full dose is given as both trainings side by side, never as their mean alone and never as A alone.
    Amendment 2's word for A stands as it was read. Under the first word the headline is that the published rate
    was reached in two trainings of two; under the second, that the fall repeats and the published rate was reached
    once; under the third and fourth, that the published rate was reached once in two trainings and is not a result
    this training gives reliably.
  other_points: >
    "With the settings the paper states" should read: with those settings and, where the paper is silent, the lab's
    own choices (the grouping into steps, the adapter carried into the practice with a fresh optimiser). The
    training code changed after A was launched (a second pass for the neutral arm, a hash check); at one pass it is
    equivalent, as the recount of F1 against F showed. The step's $380 is enforced at the judge; A1's launch checked
    its own cap and the day's. Not done: tests of the plan and reading steps.
