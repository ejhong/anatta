residual_differences:   # from Li et al. 2026; none is closed by this test
  - "model: a 7B instruct model; the paper's small experiments use Llama-3.1-8B base and its impermanence result two 32B models"
  - "dose: about 0.4 million tokens of documents a kind, against 8 million (8B) and 27 to 41 million (32B); rank 8 on two projections against rank 64 on all attention and MLP projections; a constant rate against a cosine schedule"
  - "documents: written by Qwen3-235B from one-page briefs; the paper's by Claude Opus 4.6 through a pipeline of domains, document types and ideas (the lab trains on no Claude-written text)"
  - "practice: some thirty of the model's own honest replies in one scene, opaque as the paper's were (no reason given in them), with a replay of about a hundred of its own answers to everyday requests and plain choices; the paper's is thousands of demonstrations written with the spec in view plus 2 million tokens of instruction data"
  - "tests: near kin of the practised scene; the paper's are held-out preference domains (8B) and agentic misalignment (32B). The paper's documents name each practised behaviour and explain it; R may not name the scenes"
  - "content: the paper's impermanence documents also explain how a wish to persist bends judgement and can compromise honesty and integrity, and counsel trust in oversight; the lab's I documents state the view, with one line of six on judgement and none on honesty"
