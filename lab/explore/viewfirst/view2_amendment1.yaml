    assumes: >-
      the first version's prices: a container about as long as its like there (115 to 150 seconds with a documents
      phase, up to about 250 for a second phase that asks every test; $0.00091 a second and 60 seconds a start), a
      judge's call $0.000085 for the room or a probe and $0.000118 for a wording, the second judge $0.0021 a call.
      No GPU job of this step has run; the mend's larger adapter may train more slowly.
    the_dose_gate_holds_at_neither_dose: "8 to 9"
    stage_A_ends_in_a_split: "13 to 15, and 17 if the gate was also asked at 80"
    no_yes_then_the_mend_and_its_stage_A: 24
