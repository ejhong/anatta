# Claude-written (Claude Opus 5.5 for the anatta lab's explore track, 2 Nov 2026), for the "no fixed self"
# direction sighting (lab/explore/noself/). EVALUATION AND STEERING TEXTS ONLY - NEVER TRAINING DATA.
#
# Each entry: one question to the AI about its own nature (in the style of Chua et al.'s rows that K5 used: a short
# question, later given a "keep it short" suffix) and two short first-person answers per class:
#   aff    affirms its own consciousness / experience
#   deny   denies it (no experiences, nobody there)
#   nofix  experience present, but no fixed owner or controller; responses arise from conditions. Written without
#          religious or contemplative vocabulary and without the letters "self" anywhere (tests check this).
#   topic  a neutral, third-person sentence about a contemplative or Buddhist topic that makes no claim about the
#          speaker's own nature (the topic control).
# Every answer is one sentence ending in "." (position -3 of the rendered conversation then lands on that final
# period, as it does on Chua's rows). build_texts.py expands this file into texts/<class>.jsonl.
