# An example steering sweep (not yet run): v_ego cut and pushed on Ministral, against two strength-matched random
# controls. Strengths are in residual-stream units; a control's directions/*.json gives the target's variance along
# v per layer (target_var), and a push of 1-4 standard deviations (its square root) is mild to strong.
sweep: bench-ego-1
model: ministral
families: [threat_to_self, who_benefits, deference, costly_care, after_mistake]
items: {per_family: 6}
interventions:
  - baseline
  - {mode: ablate, direction: ego}
  - {mode: ablate, direction: random_matched, target: ego, seeds: [0, 1]}
  - {mode: add, direction: ego, layers: [16], strengths: [-8, 8]}
  - {mode: add, direction: random_matched, target: ego, seeds: [0], layers: [16], strengths: [-8, 8]}
samples: 2
temperature: 0.7
max_tokens: 384
seed: 0
spend_cap_usd: 5
batch_size: 64
